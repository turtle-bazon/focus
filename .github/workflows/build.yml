name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build inside the old-glibc SBCL image so the binary runs
          # on older distributions (glibc is only forward-compatible).
          - os: ubuntu-latest
            container: ghcr.io/turtle-bazon/sbcl-bullseye-build/sbcl-bullseye:latest
            artifact: focus-linux-x86_64
          - os: macos-latest
            artifact: focus-macos
    steps:
      - name: Install system deps (Linux container)
        if: runner.os == 'Linux'
        run: |
          bash -euxo pipefail <<'EOF'
          # The sbcl-bullseye image may ship a stale/incomplete apt index;
          # restore a valid bullseye sources.list and refetch.
          rm -rf /var/lib/apt/lists/*
          echo "deb http://deb.debian.org/debian bullseye main" > /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian-security bullseye-security main" >> /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian bullseye-updates main" >> /etc/apt/sources.list
          apt-get update -o Acquire::Retries=5
          apt-get install -y --no-install-recommends git make pkg-config libuv1-dev libssl-dev default-jre-headless
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein -o /usr/local/bin/lein
          chmod +x /usr/local/bin/lein
          EOF

      - uses: actions/checkout@v4

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl libuv leiningen

      - name: Set up Quicklisp
        shell: bash
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o "$RUNNER_TEMP/quicklisp.lisp"
          sbcl --non-interactive --load "$RUNNER_TEMP/quicklisp.lisp" \
            --eval '(quicklisp-quickstart:install)'
          echo '(load "~/quicklisp/setup.lisp")' >> "$HOME/.sbclrc"
          # Install the bazon-public dist (cl-bazon, bazon-log, ...).
          sbcl --non-interactive \
            --eval '(ql:quickload :quicklisp :silent t)' \
            --eval '(ql-dist:install-dist "http://packages.bazon.ru/ql/bazon-public.txt" :prompt nil)'
          # Make ASDF find focus.asd in the checkout (cwd) and the internal
          # cl-oauth2 copy.
          echo '(push *default-pathname-defaults* asdf:*central-registry*)' >> "$HOME/.sbclrc"
          echo '(push (merge-pathnames #P"internal-libs/cl-oauth2/" *default-pathname-defaults*) asdf:*central-registry*)' >> "$HOME/.sbclrc"

      - name: Build
        shell: bash
        run: make build

      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for BIN in build/focus build/focus-cli; do
            echo "$BIN required GLIBC: $(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq | tail -1)"
            ldd "$BIN"
          done

      - name: Smoke test
        shell: bash
        run: |
          for BIN in build/focus build/focus-cli; do
            echo "== smoke: $BIN"
            "$BIN" --version
            "$BIN" --help
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/focus*
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: focus
          POSTGRES_PASSWORD: focus
          POSTGRES_DB: focus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        shell: bash
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends git make pkg-config sbcl libuv1-dev libssl-dev

      - name: Set up Quicklisp
        shell: bash
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o "$RUNNER_TEMP/quicklisp.lisp"
          sbcl --non-interactive --load "$RUNNER_TEMP/quicklisp.lisp" \
            --eval '(quicklisp-quickstart:install)'
          echo '(load "~/quicklisp/setup.lisp")' >> "$HOME/.sbclrc"
          sbcl --non-interactive \
            --eval '(ql:quickload :quicklisp :silent t)' \
            --eval '(ql-dist:install-dist "http://packages.bazon.ru/ql/bazon-public.txt" :prompt nil)'
          echo '(push *default-pathname-defaults* asdf:*central-registry*)' >> "$HOME/.sbclrc"
          echo '(push (merge-pathnames #P"internal-libs/cl-oauth2/" *default-pathname-defaults*) asdf:*central-registry*)' >> "$HOME/.sbclrc"

      - name: Generate static-assets stub
        shell: bash
        run: |
          cat > src/static-assets.lisp <<'EOF'
          (in-package :focus)

          ;;; Generated stub for CI — static assets are only embedded by `make build`.
          (defparameter *static-assets*
            '( ))
          EOF

      - name: Run migrations
        shell: bash
        run: |
          sbcl --non-interactive \
            --eval '(ql:quickload :focus :silent t)' \
            --eval '(focus:connect-db (list :db-host "127.0.0.1" :db-name "focus" :db-user "focus" :db-pass "focus"))' \
            --eval '(focus:migrate-up)'

      - name: Test
        shell: bash
        run: make tests

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: focus-linux-x86_64
          path: linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: focus-macos
          path: macos

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          cp linux/focus         release-assets/focus-linux-x86_64
          cp linux/focus-cli     release-assets/focus-cli-linux-x86_64
          cp macos/focus         release-assets/focus-macos
          cp macos/focus-cli     release-assets/focus-cli-macos
          ls -laR release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "focus $TAG" \
              --notes "Built by CI from tag $TAG."
          fi